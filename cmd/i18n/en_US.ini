# Success
0=Operation completed successfully

# 1xx: Config Error
100=Configuration file not found
101=Configuration file format error

# 2xx: Event IO Error
200=Event handler already registered
201=Event source not found
202=Event storage error
203=Event emit timeout

# 3xx: Provider Error
300=Provider creation error
301=No provider available
302=Provider authentication error
303=No available provider
304=Provider not found

# 4xx: Lock Error
400=Lock error
401=Lock failed

# 5xx: Session Error
500=Failed to write history
501=Session not found
502=Session creation error
503=Session stop error

# 6xx: Tool Error
600=Tool not found
601=Tool execution error

# 7xx: Agent Core Error
700=Agent core configuration error
701=Invalid response from LLM
