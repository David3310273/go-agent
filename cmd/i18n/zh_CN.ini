# 成功
0=操作成功完成

# 1xx: 配置错误
100=配置文件未找到
101=配置文件格式错误

# 2xx: 事件 IO 错误
200=事件处理器已注册
201=事件源未找到
202=事件存储错误
203=事件发送超时

# 3xx: 提供者错误
300=提供者创建错误
301=没有可用的提供者
302=提供者认证错误
303=没有可用的提供者
304=提供者未找到

# 4xx: 锁错误
400=锁错误
401=获取锁失败

# 5xx: 会话错误
500=写入历史记录失败
501=会话未找到
502=会话创建错误
503=会话停止错误

# 6xx: 工具错误
600=工具未找到
601=工具执行错误

# 7xx: Agent 核心错误
700=Agent 核心配置错误
701=LLM 返回无效响应
