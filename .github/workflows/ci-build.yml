name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Unit Test
        run: go test ./... -count=1 -timeout 5m

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cmd: ${{ steps.filter.outputs.cmd }}
      app: ${{ steps.filter.outputs.app }}
      frontend: ${{ steps.filter.outputs.frontend }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cmd:
              - 'cmd/**'
            app:
              - 'app/**'
              - '!app/frontend/**'
            frontend:
              - 'app/frontend/**'
            core:
              - 'core/**'
              - 'agent/**'
              - 'providers/**'
              - 'knowledgebase/**'
              - 'storage/**'
              - 'tools/**'
              - 'sandbox/**'
              - 'go.mod'
              - 'go.sum'

  build-server:
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build Server
        run: go build -o bin/server ./app

  build-cmd:
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.cmd == 'true' || needs.detect-changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build CLI
        run: go build -o bin/cmd ./cmd

  build-frontend:
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app/frontend/web

      - name: Build Frontend
        run: npm run build
        working-directory: app/frontend/web