{{- if and .Values.server.enabled .Values.persistence.logs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "go-agent.fullname" . }}-logs-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "go-agent.server.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.logs.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.logs.size }}
  {{- with .Values.persistence.logs.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
{{- if and .Values.server.enabled .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "go-agent.fullname" . }}-data-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "go-agent.server.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.data.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{- with .Values.persistence.data.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}